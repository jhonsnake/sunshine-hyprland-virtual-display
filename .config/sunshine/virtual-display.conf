# Optional overrides for the sunshine-* scripts (sourced as bash).
# Copy to ~/.config/sunshine/virtual-display.conf and uncomment what you need.

# Physical monitor name (see `hyprctl monitors`). Empty = first non-HEADLESS monitor.
#PHYSICAL_MONITOR="DP-1"

# Mode HEADLESS uses between sessions (and when the client doesn't report one).
#HEADLESS_DEFAULT_MODE="1920x1080@60"

# Resize HEADLESS to the client's resolution and refresh rate on connect (Apollo-style).
#MATCH_CLIENT_RESOLUTION=true

# Scale for the client resolution: "auto" (1.5 for 4K, 1.25 for 1440p, 1 otherwise) or a number.
#HEADLESS_SCALE="auto"

# Workspace that lives on HEADLESS between sessions.
#REMOTE_WORKSPACE=11

# If Sunshine runs as a systemd user service, name it here so the scripts restart
# it with systemctl instead of exec'ing a second copy.
#SUNSHINE_UNIT="app-dev.lizardbyte.app.Sunshine.service"
